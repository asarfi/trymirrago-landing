<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
    background: #F8FAFC;
    color: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
  }
  .card {
    max-width: 460px;
    width: 100%;
    text-align: center;
    background: #FFFFFF;
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 20px 50px -20px rgba(29, 75, 167, 0.15);
  }
  .logo { width: 170px; height: auto; margin-bottom: 28px; }
  p {
    color: #475569;
    line-height: 1.6;
    font-size: 15px;
    margin: 0 0 28px;
  }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.cta {
    color: #FFFFFF;
    background: linear-gradient(90deg, #1D4BA7, #265BC0);
    font-weight: 600;
    text-decoration: none;
    padding: 13px 20px;
    border-radius: 999px;
    font-size: 14.5px;
    transition: opacity 0.2s;
  }
  a.cta:hover { opacity: 0.9; }
  a.secondary {
    color: #1D4BA7;
    font-weight: 600;
    text-decoration: none;
    padding: 13px 20px;
    border-radius: 999px;
    border: 1px solid #E2E8F0;
    font-size: 14.5px;
  }
  a.secondary:hover { background: #F1F5FF; }
  .footer {
    margin-top: 28px;
    font-size: 12.5px;
    color: #94A3B8;
    line-height: 1.6;
  }
  .footer a { color: #94A3B8; }
</style>
